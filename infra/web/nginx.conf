# Single-origin front door for a hosted instance.
#
# Locally the browser talks to three origins — the Vite dev server, the API on
# :8000 and MediaMTX on :8889 — which is fine on localhost and wrong everywhere
# else. It needs three public hostnames, three TLS certificates and a CORS
# policy, and every one of those is a thing that can be misconfigured on the day
# an evaluator opens the link.
#
# Here everything is one origin, so a tunnel or a reverse proxy has exactly one
# hostname to route and CORS does not arise at all.
#
#   /            the built React app, static
#   /api/…       the platform API
#   /media/…     MediaMTX: HLS playlists and segments, and WHEP signalling

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS, consulted at *request* time.
    #
    # Without this, nginx resolves each upstream hostname once when it loads the
    # configuration and caches the address for the life of the process. Recreate
    # the api container — any redeploy does — and it comes back on a new IP while
    # nginx keeps dialling the old one, so the whole site 502s until nginx is
    # restarted too. Found exactly that way: `up -d --build api` left a healthy
    # API behind a proxy that could not reach it.
    #
    # The `set` lines below matter as much as the resolver. nginx only re-resolves
    # when the upstream is a *variable*; a literal hostname in proxy_pass is
    # resolved at startup however good the resolver is.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is content-hashed by Vite, so it can be cached hard. index.html
    # must not be, or a redeploy leaves browsers pinned to the old asset names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths are app routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $api_upstream api;
        # $request_uri keeps the /api prefix, which the API expects — its routes
        # are mounted at /api/... and are not being stripped here.
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report export renders a PDF with embedded evidence crops and can take
        # a while on a wide date range. The default 60s truncates it.
        proxy_read_timeout 300s;
        # Evidence images and PDFs stream better unbuffered, and the alert feed
        # is long-polled.
        proxy_buffering off;
    }

    location /media/ {
        set $media_upstream mediamtx;
        # A variable upstream disables proxy_pass's own URI rewriting, so the
        # /media prefix is stripped here instead: /media/<path>/index.m3u8
        # reaches MediaMTX as /<path>/index.m3u8.
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://$media_upstream:8888;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Low-latency HLS holds the playlist request open until the next part is
        # ready. Buffering it would defeat the point and add a segment of delay.
        proxy_buffering off;
        # A camera that has just been relayed may not have published its first
        # segment yet; the player retries, so a short timeout is right here.
        proxy_read_timeout 30s;
    }

    # WHEP signalling, for the local/LAN case where WebRTC media can actually
    # flow. Left in place deliberately: the same image then serves both
    # deployments, and which transport is used is a setting rather than a build.
    location /whep/ {
        set $whep_upstream mediamtx;
        rewrite ^/whep/(.*)$ /$1 break;
        proxy_pass http://$whep_upstream:8889;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # Modest hardening. Nothing here is a substitute for the API's own
    # authentication; it is the cheap layer above it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 32m;   # bulk camera CSV import
}
