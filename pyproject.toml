[project]
name = "cctv-platform"
version = "0.1.0"
description = "Statewide CCTV integration, ANPR and vehicle-trace platform — Gujarat Police Hackathon 2026"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    # PDF for the detection report (Deliverable 4). fpdf2 rather than reportlab:
    # 337 kB against several megabytes, which matters on a link measured at
    # ~132 kB/s, and it embeds the evidence JPEGs directly.
    "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# Only needed to regenerate the editable deck: make deck-pptx
deck = [
    "python-pptx>=1.0",
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:services.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# ANN101/ANN102 (self, cls) were removed from ruff; listing them only warns.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"scripts/*" = ["ANN"]

